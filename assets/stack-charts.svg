<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img">
<style>
  text{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  @keyframes gridMove{to{transform:translate(40px,40px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes slideA{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-14px)}}
  @keyframes slideB{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
  @keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(var(--h))}}
  .grid{animation:gridMove 6s linear infinite}
  .float{animation:floaty 5s ease-in-out infinite}
  .spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
  .spinR{animation:spinR 36s linear infinite;transform-box:fill-box;transform-origin:center}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .rise{opacity:0;animation:rise .7s ease-out forwards}
  .glowtxt{filter:drop-shadow(0 0 6px #a855f7)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
@keyframes draw{to{stroke-dasharray:var(--l) 1000}}</style>
<defs>
  <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07020f"/><stop offset="1" stop-color="#1b0838"/>
  </linearGradient>
  <linearGradient id="barc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a855f7" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d946ef" stop-opacity=".1"/>
  </linearGradient>
  <linearGradient id="embc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="glowc"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <filter id="blurc" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="gridc" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".10"/>
  </pattern>
</defs>
<clipPath id="roundc"><rect width="900" height="380" rx="22"/></clipPath>
<g clip-path="url(#roundc)">
  
  <rect width="900" height="380" fill="url(#bgc)"/>
  <g class="grid"><rect x="-40" y="-40" width="980" height="460" fill="url(#gridc)"/></g>
  <g class="pulse"><ellipse cx="702" cy="190" rx="252.00000000000003" ry="228" fill="url(#glowc)"/></g>

  <text x="40" y="54" font-size="24" font-weight="800" fill="#ede9fe">Stack Breakdown</text>
  <rect x="40" y="66" width="70" height="4" rx="2" fill="#d946ef"/>
  <g transform="translate(190 218)">
    <circle r="92" fill="none" stroke="#a855f7" stroke-opacity=".12" stroke-width="30"/>
    <circle r="92" fill="none" stroke="#a855f7" stroke-width="30" stroke-dashoffset="0.00"
        style="--l:104.38;stroke-dasharray:0 578.05;animation:draw 1.2s 0.2s ease-out forwards" transform="rotate(-90)"/><circle r="92" fill="none" stroke="#f472b6" stroke-width="30" stroke-dashoffset="-108.38"
        style="--l:176.64;stroke-dasharray:0 578.05;animation:draw 1.2s 0.45s ease-out forwards" transform="rotate(-90)"/><circle r="92" fill="none" stroke="#60a5fa" stroke-width="30" stroke-dashoffset="-289.03"
        style="--l:176.64;stroke-dasharray:0 578.05;animation:draw 1.2s 0.7s ease-out forwards" transform="rotate(-90)"/><circle r="92" fill="none" stroke="#d946ef" stroke-width="30" stroke-dashoffset="-469.67"
        style="--l:104.38;stroke-dasharray:0 578.05;animation:draw 1.2s 0.95s ease-out forwards" transform="rotate(-90)"/>
    <text y="6" font-size="40" font-weight="800" text-anchor="middle" fill="#ede9fe" class="glowtxt">32</text>
    <text y="30" font-size="12" letter-spacing="3" text-anchor="middle" fill="#c4b5fd">TOOLS</text>
  </g>
  <g transform="translate(60 345)"><g transform="translate(0 0)"><rect width="10" height="10" rx="3" y="-9" fill="#a855f7"/><text x="16" y="0" font-size="11" fill="#c4b5fd">Frontend</text></g><g transform="translate(78 0)"><rect width="10" height="10" rx="3" y="-9" fill="#f472b6"/><text x="16" y="0" font-size="11" fill="#c4b5fd">Backend</text></g><g transform="translate(168 0)"><rect width="10" height="10" rx="3" y="-9" fill="#60a5fa"/><text x="16" y="0" font-size="11" fill="#c4b5fd">Tools</text></g><g transform="translate(260 0)"><rect width="10" height="10" rx="3" y="-9" fill="#d946ef"/><text x="16" y="0" font-size="11" fill="#c4b5fd">Operating</text></g></g>
  <g transform="translate(470 50)">
    <text x="0" y="120" font-size="15" font-weight="600" fill="#ede9fe">Frontend</text>
    <text x="400" y="120" font-size="15" font-weight="800" text-anchor="end" fill="#a855f7">6</text>
    <rect x="0" y="130" width="400" height="12" rx="6" fill="#a855f7" fill-opacity=".14"/>
    <rect x="0" y="130" width="198" height="12" rx="6" fill="#a855f7" style="transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s 0.3s ease-out forwards" filter="drop-shadow(0 0 4px #a855f7)"/>
    <text x="0" y="182" font-size="15" font-weight="600" fill="#ede9fe">Backend</text>
    <text x="400" y="182" font-size="15" font-weight="800" text-anchor="end" fill="#f472b6">10</text>
    <rect x="0" y="192" width="400" height="12" rx="6" fill="#a855f7" fill-opacity=".14"/>
    <rect x="0" y="192" width="330" height="12" rx="6" fill="#f472b6" style="transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s 0.5s ease-out forwards" filter="drop-shadow(0 0 4px #f472b6)"/>
    <text x="0" y="244" font-size="15" font-weight="600" fill="#ede9fe">Tools &amp; IDE</text>
    <text x="400" y="244" font-size="15" font-weight="800" text-anchor="end" fill="#60a5fa">10</text>
    <rect x="0" y="254" width="400" height="12" rx="6" fill="#a855f7" fill-opacity=".14"/>
    <rect x="0" y="254" width="330" height="12" rx="6" fill="#60a5fa" style="transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s 0.7s ease-out forwards" filter="drop-shadow(0 0 4px #60a5fa)"/>
    <text x="0" y="306" font-size="15" font-weight="600" fill="#ede9fe">Operating Systems</text>
    <text x="400" y="306" font-size="15" font-weight="800" text-anchor="end" fill="#d946ef">6</text>
    <rect x="0" y="316" width="400" height="12" rx="6" fill="#a855f7" fill-opacity=".14"/>
    <rect x="0" y="316" width="198" height="12" rx="6" fill="#d946ef" style="transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s 0.9000000000000001s ease-out forwards" filter="drop-shadow(0 0 4px #d946ef)"/></g></g>
<rect x="1" y="1" width="898" height="378" rx="22" fill="none" stroke="#a855f7" stroke-opacity=".45"/>
</svg>