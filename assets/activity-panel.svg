  <linearGradient id="emba" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="glowa"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <filter id="blura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grida" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".10"/>
  </pattern>
</defs>
<clipPath id="rounda"><rect width="900" height="500" rx="22"/></clipPath>
