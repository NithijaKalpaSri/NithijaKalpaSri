<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img">
<style>
  text{font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  @keyframes gridMove{to{transform:translate(40px,40px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes slideA{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-14px)}}
  @keyframes slideB{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,14px)}}
  @keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(var(--h))}}
  .grid{animation:gridMove 6s linear infinite}
  .float{animation:floaty 5s ease-in-out infinite}
  .spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
  .spinR{animation:spinR 36s linear infinite;transform-box:fill-box;transform-origin:center}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .rise{opacity:0;animation:rise .7s ease-out forwards}
  .glowtxt{filter:drop-shadow(0 0 6px #a855f7)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

    @keyframes draw1{to{stroke-dashoffset:0}}
    @keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
    @keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes sweep{0%{transform:translateX(-160px)}100%{transform:translateX(1100px)}}
    @keyframes ringDash{to{stroke-dashoffset:-400}}
    @keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
    .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw1 2.4s .5s ease-out forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:popIn .5s ease-out forwards}
    .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:growY .9s ease-out forwards}
    .sweep{animation:sweep 5s 2.5s ease-in-out infinite}
    .ringrun{stroke-dasharray:40 360;animation:ringDash 4s linear infinite}
    .flame{transform-box:fill-box;transform-origin:center bottom;animation:flame 1.4s ease-in-out infinite}
  </style>
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07020f"/><stop offset="1" stop-color="#1b0838"/>
  </linearGradient>
  <linearGradient id="bara" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a855f7" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d946ef" stop-opacity=".1"/>
